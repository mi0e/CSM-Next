<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="CSM-Next：CF-Server-Monitor 独立前端主题">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8f9fb">
    <!-- 上游静态主题约定：独立静态部署时从此 meta 读取后端地址，多个用英文逗号分隔；主题商店（同源）部署留空即可 -->
    <!-- <meta name="apiBase" content="https://your-worker.example.com"> -->
    <title>Server Monitor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2317191d'/%3E%3Cpath d='M46 20c-4-4-8-6-14-6-10 0-18 8-18 18s8 18 18 18c6 0 11-2 15-7l-7-6c-2 3-5 4-8 4-5 0-9-4-9-9s4-9 9-9c3 0 6 1 8 4z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./assets/css/main.css?v=20260726-hash-router">
    <link rel="stylesheet" href="./assets/css/detail.css?v=20260726-hash-router">
    <style id="themeCustomStyle"></style>
  </head>
  <body>
    <div id="appRoot"></div>

    <!-- ==================== 首页视图 ==================== -->
    <template id="viewDashboard">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="#/" aria-label="返回监控首页">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span id="brandTitle" class="brand-title">Server Monitor</span>
          </a>

          <nav class="top-actions" aria-label="页面工具">
            <button id="refreshButton" class="icon-button" type="button" data-i18n-title="refresh" title="刷新数据">
              <svg class="lucide-icon" data-lucide="refresh-cw" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
            <button id="themeButton" class="icon-button" type="button" data-i18n-title="theme" title="切换主题">
              <svg class="lucide-icon" data-lucide="sun-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v2"/><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/><path d="M16 12a4 4 0 0 0-4-4"/><path d="m19 5-1.256 1.256"/><path d="M20 12h2"/></svg>
            </button>
            <button id="languageButton" class="icon-button language-button" type="button" data-i18n-title="language" title="切换语言">
              <svg class="lucide-icon" data-lucide="languages" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
            </button>
            <button id="themeSettingsButton" class="icon-button" type="button" data-i18n-title="themeCustomize" title="主题自定义">
              <svg class="lucide-icon" data-lucide="palette" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            </button>
            <button id="authButton" class="icon-button" type="button" data-i18n-title="authorize" title="登录授权">
              <svg class="lucide-icon" data-lucide="circle-user-round" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/></svg>
            </button>
          </nav>
        </div>
      </header>

      <main class="dashboard">
        <section class="dashboard-heading">
          <div>
            <p id="siteEyebrow" class="eyebrow">SERVER OBSERVABILITY</p>
            <h1 data-i18n="dashboard">Dashboard</h1>
          </div>
          <div id="liveState" class="live-state" aria-live="polite">
            <span></span><em data-i18n="connecting">正在连接</em>
          </div>
        </section>

        <section class="overview-shell" aria-label="全局统计">
          <div class="overview-grid">
            <article class="overview-card">
            <div class="overview-label">
              <span data-i18n="currentOnline">当前在线</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
            </div>
            <strong><span id="onlineCount">-</span> <i>/</i> <span id="totalCount">-</span></strong>
            <small><span id="offlineCount">-</span> <span data-i18n="offline">离线</span></small>
          </article>

          <article class="overview-card">
            <div class="overview-label">
              <span data-i18n="region">区域</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.3 3.5 5.1 3.5 8.5s-1.2 6.2-3.5 8.5M12 3.5C9.7 5.8 8.5 8.6 8.5 12s1.2 6.2 3.5 8.5"/></svg>
            </div>
            <strong id="regionCount">-</strong>
            <small data-i18n="regionHint">节点分布区域</small>
          </article>

          <article class="overview-card overview-card-double">
            <div class="overview-label">
              <span data-i18n="trafficOverview">流量概览</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M10 7h7v7"/></svg>
            </div>
            <strong class="overview-line"><b class="up">↑</b><span id="trafficUp">-</span></strong>
            <strong class="overview-line"><b class="down">↓</b><span id="trafficDown">-</span></strong>
          </article>

          <article class="overview-card overview-card-double">
            <div class="overview-label">
              <span data-i18n="networkSpeed">网络速度</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 3-6 10h5l-1 8 6-10h-5l1-8Z"/></svg>
            </div>
            <strong class="overview-line"><b class="up">↑</b><span id="speedUp">-</span></strong>
            <strong class="overview-line"><b class="down">↓</b><span id="speedDown">-</span></strong>
            </article>

            <article id="currentTimeCard" class="overview-card">
              <div class="overview-label">
                <span data-i18n="currentTime">当前时间</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
              </div>
              <strong id="currentTime">--:--:--</strong>
              <small id="currentDate">----</small>
            </article>
          </div>

          <section id="serverGlobe" class="globe-panel" aria-labelledby="globeTitle" hidden>
            <div class="globe-panel-heading">
              <div>
                <h2 id="globeTitle" data-globe-title>服务器地球仪</h2>
                <p data-globe-status aria-live="polite">0 个国家/地区 · 0/0 在线</p>
              </div>
              <div class="globe-controls" aria-label="地球仪控制">
                <button type="button" data-globe-action="zoom-out" aria-label="缩小" title="缩小">−</button>
                <button type="button" data-globe-action="reset" aria-label="重置地球仪视角" title="重置地球仪视角">↺</button>
                <button type="button" data-globe-action="zoom-in" aria-label="放大" title="放大">+</button>
              </div>
            </div>
            <canvas class="globe-canvas" tabindex="0" role="img" aria-label="交互式服务器分布地球仪"></canvas>
            <p class="globe-help" data-globe-help>拖动旋转；滚轮、+/− 或按钮缩放。国家位置仅为代表点，并非服务器所在城市。</p>
          </section>
        </section>

        <section class="dashboard-controls" aria-label="筛选与视图">
          <label class="search-box" for="searchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="按名称、区域或系统搜索节点…">
            <button id="clearSearch" class="clear-search" type="button" aria-label="清除搜索" hidden>×</button>
          </label>

          <div class="view-switch" role="group" aria-label="视图切换">
            <button class="view-button active" type="button" data-view="grid" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
              <span data-i18n="grid">网格</span>
            </button>
            <button class="view-button" type="button" data-view="table" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M4 14.5h16M9 5v14"/></svg>
              <span data-i18n="table">表格</span>
            </button>
          </div>
        </section>

        <section class="filter-row">
          <div id="filterBar" class="filter-bar" aria-label="区域筛选"></div>
          <p id="serverSummary" class="server-summary"><span></span><em>--</em></p>
        </section>

        <div id="statusBanner" class="status-banner" role="status" hidden>
          <div>
            <strong id="statusTitle">无法读取监控数据</strong>
            <p id="statusMessage"></p>
          </div>
          <button id="retryButton" type="button" data-i18n="retry">重试</button>
        </div>

        <section id="gridView" class="view-panel active" aria-live="polite">
          <div id="cardGroups" class="card-groups">
            <div class="server-grid skeleton-grid" aria-hidden="true">
              <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
            </div>
          </div>
        </section>

        <section id="tableView" class="view-panel" hidden>
          <div class="table-shell">
            <table>
              <thead>
                <tr>
                  <th data-i18n="status">状态</th>
                  <th data-i18n="node">节点</th>
                  <th data-i18n="region">区域</th>
                  <th data-i18n="system">系统</th>
                  <th>CPU</th>
                  <th>RAM</th>
                  <th data-i18n="disk">磁盘</th>
                  <th data-i18n="networkSpeed">网络速度</th>
                  <th data-i18n="updated">更新时间</th>
                </tr>
              </thead>
              <tbody id="serverTableBody"></tbody>
            </table>
          </div>
        </section>

        <footer class="footer">
          <a class="footer-project-link" href="https://github.com/huilang-me/CF-Server-Monitor" target="_blank" rel="noopener noreferrer">
            <span id="versionText">CF-Server-Monitor Theme</span><span class="footer-external-mark" aria-hidden="true">↗</span>
          </a>
          <span class="footer-links">
            <a class="footer-project-link" href="https://github.com/mi0e/CSM-Next" target="_blank" rel="noopener noreferrer">CSM-Next<span class="footer-external-mark" aria-hidden="true">↗</span></a>
            <span class="footer-separator" aria-hidden="true">·</span>
            <a id="footerAdminLink" href="#/" data-i18n="admin">管理后台</a>
          </span>
        </footer>
      </main>
    </div>

    <div id="themeDrawerBackdrop" class="theme-drawer-backdrop" aria-hidden="true"></div>
    <aside id="themeDrawer" class="theme-drawer" aria-hidden="true" aria-labelledby="themeDrawerTitle">
      <header class="theme-drawer-header">
        <div>
          <p data-i18n="themeSubtitle">个性化外观</p>
          <h2 id="themeDrawerTitle" data-i18n="themeCustomize">主题自定义</h2>
        </div>
        <button id="themeDrawerClose" class="theme-drawer-close" type="button" data-i18n-title="close" title="关闭">×</button>
      </header>

      <div id="themeSettingsAuth" class="theme-settings-auth is-authorized">
        <span aria-hidden="true"></span>
        <p id="themeSettingsAuthText" data-i18n="themeLocalHint">设置保存在当前浏览器，仅对你生效；站长可用下方"复制站点配置"让全站访客默认使用。</p>
      </div>

      <form id="themeSettingsForm" class="theme-settings-form">
        <fieldset id="themeSettingsFields">
          <section class="theme-settings-group" data-theme-group="background">
            <div class="theme-settings-group-body">
              <label class="theme-settings-field">
                <span data-i18n="themeBackground">图片地址</span>
                <input id="themeBackgroundImage" type="url" inputmode="url" placeholder="https://example.com/background.webp">
                <small data-i18n="themeBackgroundHint">仅允许 HTTPS 图片地址；留空表示不使用背景图。跨域图片可能需要站长在上游后台 CSP 名单放行。</small>
              </label>
            </div>
          </section>

          <section class="theme-settings-group" data-theme-group="effects">
            <div class="theme-settings-group-body">
              <label class="theme-settings-toggle" for="themeTransparencyEnabled">
                <span>
                  <b data-i18n="themeTransparency">界面透明化</b>
                  <small data-i18n="themeTransparencyHint">独立控制卡片和顶部栏的透明效果。</small>
                </span>
                <input id="themeTransparencyEnabled" type="checkbox" role="switch">
                <i aria-hidden="true"></i>
              </label>

              <label class="theme-settings-toggle" for="themeGlobeEnabled">
                <span>
                  <b data-i18n="themeGlobe">服务器地球仪</b>
                  <small data-i18n="themeGlobeHint">在首页概览旁显示交互式地球仪，并将五张卡片整理为紧凑布局。</small>
                </span>
                <input id="themeGlobeEnabled" type="checkbox" role="switch">
                <i aria-hidden="true"></i>
              </label>

              <div id="themeTransparencyOptions" class="theme-transparency-options" hidden>
                <div class="theme-settings-field">
                  <span id="themeTransparencyModeLabel" data-i18n="themeTransparencyMode">透明方案</span>
                  <div class="theme-transparency-modes" role="radiogroup" aria-labelledby="themeTransparencyModeLabel">
                    <label>
                      <input id="themeTransparencySoft" type="radio" name="themeTransparencyMode" value="soft" checked>
                      <span><strong data-i18n="themeTransparencySoft">柔和透明</strong><small data-i18n="themeTransparencySoftHint">仅透明，不模糊后方内容。</small></span>
                    </label>
                    <label>
                      <input id="themeTransparencyGlass" type="radio" name="themeTransparencyMode" value="glass">
                      <span><strong data-i18n="themeTransparencyGlass">毛玻璃</strong><small data-i18n="themeTransparencyGlassHint">透明并模糊后方内容。</small></span>
                    </label>
                  </div>
                </div>

                <label class="theme-settings-field">
                  <span><i data-i18n="themeTransparencyIntensity">透明强度</i><output id="themeTransparencyOutput">0%</output></span>
                  <input id="themeTransparencyIntensity" type="range" min="0" max="80" step="5" value="0">
                  <small data-i18n="themeTransparencyIntensityHint">数值越高，卡片和顶部栏越透明。</small>
                </label>

                <label id="themeBlurField" class="theme-settings-field" hidden>
                  <span><i data-i18n="themeBlurIntensity">毛玻璃强度</i><output id="themeBlurOutput">18px</output></span>
                  <input id="themePanelBlur" type="range" min="0" max="30" step="1" value="18">
                  <small data-i18n="themeBlurIntensityHint">只在毛玻璃方案下生效。</small>
                </label>
              </div>
            </div>
          </section>

          <section class="theme-settings-group" data-theme-group="advanced">
            <div class="theme-settings-group-body">
              <label class="theme-settings-field">
                <span data-i18n="themeCustomCss">自定义 CSS</span>
                <textarea id="themeCustomCss" rows="11" maxlength="20000" spellcheck="false" placeholder=":root { --primary: #5aa0f8; }"></textarea>
                <small data-i18n="themeCssHint">不允许 @import、url() 或脚本；外部资源请使用背景图片设置。</small>
              </label>
            </div>
          </section>
        </fieldset>

        <p id="themeSettingsError" class="theme-settings-error" role="alert" hidden></p>
        <div class="theme-settings-actions">
          <button id="themeSettingsReset" type="button" data-i18n="restoreDefaults">恢复默认</button>
          <button id="themeSettingsExport" type="button" data-i18n="themeExport" data-i18n-title="themeExportHint" title="站长专用：复制后粘贴到上游后台「设置 → 自定义脚本」，保存后全站访客默认使用当前主题。">复制站点配置</button>
          <button id="themeSettingsSave" class="primary" type="submit" data-i18n="saveTheme">保存主题</button>
        </div>
      </form>
    </aside>

    <div id="turnstileModal" class="modal-backdrop" hidden>
      <section class="verify-modal" role="dialog" aria-modal="true" aria-labelledby="verifyTitle">
        <span class="brand-mark" aria-hidden="true">C</span>
        <h2 id="verifyTitle" data-i18n="verifyTitle">需要完成安全验证</h2>
        <p id="verifyMessage" data-i18n="verifyMessage">验证完成后将自动载入监控数据。</p>
        <div id="turnstileWidget" class="turnstile-widget"></div>
      </section>
    </div>

    <div id="loginModal" class="modal-backdrop" hidden>
      <section class="verify-modal login-modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <span class="brand-mark" aria-hidden="true">C</span>
        <h2 id="loginTitle" data-i18n="loginTitle">登录授权</h2>
        <p id="loginMessage" data-i18n="loginMessage">登录后可查看非公开站点、隐藏节点和长历史数据。</p>
        <form id="loginForm" class="login-form" autocomplete="on">
          <label id="loginSiteField" class="login-field" hidden>
            <span data-i18n="site">站点</span>
            <select id="loginSiteSelect" aria-label="API site"></select>
          </label>
          <label class="login-field">
            <span data-i18n="username">用户名</span>
            <input id="loginUsername" name="username" type="text" autocomplete="username" required>
          </label>
          <label class="login-field">
            <span data-i18n="password">密码</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
          </label>
          <div id="loginTurnstile" class="turnstile-widget" hidden></div>
          <p id="loginError" class="login-error" hidden></p>
          <div class="login-actions">
            <button id="loginLogout" class="login-logout" type="button" data-i18n="logout" hidden>退出登录</button>
            <button id="loginCancel" type="button" data-i18n="cancel">取消</button>
            <button id="loginSubmit" type="submit" data-i18n="login">登录</button>
          </div>
        </form>
        <p class="login-admin-hint">
          <a id="loginAdminLink" href="#/" target="_blank" rel="noopener noreferrer" data-i18n="openOriginalAdmin">打开原站后台</a>
        </p>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </template>

    <!-- ==================== 节点详情视图 ==================== -->
    <template id="viewServerDetail">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="#/" aria-label="返回监控首页">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span id="brandTitle" class="brand-title">Server Monitor</span>
          </a>

          <nav class="top-actions" aria-label="页面工具">
            <a class="icon-button" href="#/" data-i18n-title="dashboard" title="仪表盘">
              <svg class="lucide-icon" data-lucide="layout-dashboard" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            </a>
            <button id="refreshButton" class="icon-button" type="button" data-i18n-title="refresh" title="刷新数据">
              <svg class="lucide-icon" data-lucide="refresh-cw" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
            <button id="themeButton" class="icon-button" type="button" data-i18n-title="theme" title="切换主题">
              <svg class="lucide-icon" data-lucide="sun-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v2"/><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/><path d="M16 12a4 4 0 0 0-4-4"/><path d="m19 5-1.256 1.256"/><path d="M20 12h2"/></svg>
            </button>
            <button id="languageButton" class="icon-button language-button" type="button" data-i18n-title="language" title="切换语言"><svg class="lucide-icon" data-lucide="languages" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></button>
            <a id="adminLink" class="icon-button" href="#/" data-i18n-title="admin" title="管理后台">
              <svg class="lucide-icon" data-lucide="settings" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
            </a>
          </nav>
        </div>
      </header>

      <main class="detail-page">
        <section id="detailLoading" class="detail-loading" aria-live="polite">
          <span class="detail-spinner"></span><p data-i18n="loading">正在载入节点详情</p>
        </section>

        <section id="detailError" class="detail-error" hidden>
          <strong data-i18n="loadFailed">无法载入节点详情</strong>
          <p id="detailErrorMessage"></p>
          <div><a href="#/" data-i18n="back">返回仪表盘</a><button id="retryButton" type="button" data-i18n="retry">重试</button></div>
        </section>

        <div id="detailContent" hidden>
          <section class="node-hero">
            <div class="node-hero-main">
              <a class="detail-back" href="#/" aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
              <span id="nodeFlag" class="detail-flag" aria-hidden="true"></span>
              <div class="node-title-wrap"><h1 id="nodeName">—</h1><code id="nodeId">—</code></div>
            </div>
            <span id="nodeStatus" class="detail-status">—</span>
          </section>

          <section id="specGrid" class="spec-grid" aria-label="服务器信息"></section>

          <section class="monitor-workspace">
            <div class="detail-tabs" role="tablist" aria-label="监控类型">
              <button class="detail-tab active" type="button" data-tab="load" role="tab" aria-selected="true">Load</button>
              <button class="detail-tab" type="button" data-tab="ping" role="tab" aria-selected="false">Ping</button>
            </div>

            <div id="historyNotice" class="history-notice" hidden></div>

            <section id="loadPanel" class="detail-panel active" role="tabpanel">
              <div class="range-switch" data-range-group="load">
                <button type="button" data-hours="0.167">10 Min</button>
                <button type="button" data-hours="0.5">30 Min</button>
                <button class="active" type="button" data-hours="1">1 Hour</button>
                <button type="button" data-hours="6">6 Hours</button>
                <button type="button" data-hours="24">1 Day</button>
              </div>

              <div class="chart-grid">
                <article class="chart-card"><header><h2>CPU</h2><span id="cpuCurrent">—</span></header><div id="cpuChart" class="chart-canvas"></div></article>
                <article class="chart-card"><header><h2>RAM</h2><span id="ramCurrent">—</span></header><div id="ramChart" class="chart-canvas"></div></article>
                <article class="chart-card"><header><h2 data-i18n="disk">磁盘</h2><span id="diskCurrent">—</span></header><div id="diskChart" class="chart-canvas"></div></article>
                <article class="chart-card"><header><h2 data-i18n="netSpeed">网络速度</h2><span id="netCurrent">—</span></header><div id="netChart" class="chart-canvas"></div></article>
                <article class="chart-card"><header><h2 data-i18n="connections">连接数</h2><span id="connectionsCurrent">—</span></header><div id="connectionsChart" class="chart-canvas"></div></article>
                <article class="chart-card"><header><h2 data-i18n="processes">进程</h2><span id="processesCurrent">—</span></header><div id="processesChart" class="chart-canvas"></div></article>
              </div>
            </section>

            <section id="pingPanel" class="detail-panel" role="tabpanel" hidden>
              <div class="range-switch" data-range-group="ping">
                <button type="button" data-hours="0.5">30 Min</button>
                <button class="active" type="button" data-hours="1">1 Hour</button>
                <button type="button" data-hours="6">6 Hours</button>
                <button type="button" data-hours="12">12 Hours</button>
                <button type="button" data-hours="24">1 Day</button>
              </div>
              <div id="pingLegend" class="ping-legend"></div>
              <article class="ping-chart-card"><div id="pingChart" class="chart-canvas ping-chart"></div></article>
            </section>
          </section>

          <footer class="footer detail-footer"><span id="versionText">CF-Server-Monitor Theme</span><a href="#/" data-i18n="back">返回仪表盘</a></footer>
        </div>
      </main>
    </div>

    <div id="loginModal" class="modal-backdrop" hidden>
      <section class="verify-modal login-modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <span class="brand-mark" aria-hidden="true">C</span>
        <h2 id="loginTitle" data-i18n="loginTitle">登录后查看长历史</h2>
        <p id="loginMessage" data-i18n="loginMessage">主题与原后台域名不同，登录状态无法自动共享。请在此登录一次，令牌会保存在当前站点。</p>
        <form id="loginForm" class="login-form" autocomplete="on">
          <label class="login-field">
            <span data-i18n="username">用户名</span>
            <input id="loginUsername" name="username" type="text" autocomplete="username" required>
          </label>
          <label class="login-field">
            <span data-i18n="password">密码</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
          </label>
          <div id="loginTurnstile" class="turnstile-widget" hidden></div>
          <p id="loginError" class="login-error" hidden></p>
          <div class="login-actions">
            <button id="loginCancel" type="button" data-i18n="cancel">取消</button>
            <button id="loginSubmit" type="submit" data-i18n="login">登录</button>
          </div>
        </form>
        <p class="login-admin-hint">
          <a id="loginAdminLink" href="#/" target="_blank" rel="noopener noreferrer" data-i18n="openAdmin">打开原站后台</a>
        </p>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </template>

    <script type="module" src="./assets/js/app.js?v=20260726-hash-router"></script>
  </body>
