<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <!-- 兼容旧版多页链接：detail.html?id=x&site=y → index.html#/server/x?site=y -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search)
        var id = params.get('id') || ''
        var site = parseInt(params.get('site') || '0', 10) || 0
        var target = new URL('./', location.href)
        if (params.get('preview') === '1') target.searchParams.set('preview', '1')
        target.hash = id
          ? '#/server/' + encodeURIComponent(id) + (site > 0 ? '?site=' + site : '')
          : '#/'
        location.replace(target.href)
      })()
    </script>
  </head>
  <body>
    <p>Redirecting… <a href="./">Open dashboard</a></p>
  </body>
</html>
